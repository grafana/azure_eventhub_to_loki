name: Release

on: [ push ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.11.7' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install .[package]

    - name: Package
      run: make clean "logexport.$(python -m setuptools_scm).zip"

    - name: Generate GitHub token
      if: startsWith(github.ref, 'refs/tags/')
      id: generate-github-token
      uses: grafana/shared-workflows/actions/create-github-app-token@5bbb526b1728ca57fbe1750c4c27ab6ab06171c2 # create-github-app-token/v1.0
      with:
        github_app: cloudonboardingci

    - name: Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: logexport.*.zip
        generate_release_notes: true
        token: ${{ steps.generate-github-token.outputs.token }}
      
